[project]
name = "pydbisam"
version = "2.0.0"
description = "Read DBISAM database tables."
readme = "README.md"
requires-python = ">=3.11"
license = "ISC"
authors = [
  {name = "Aaron Linville", email = "aaron@linville.org"},
]

keywords = ["dbisam"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Utilities",
]

[build-system]
requires = ["setuptools >= 80.9"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "black==26.10.*",
  "build==1.6.*",
  "ruff==0.17.*",
  "twine==7.0.*",
]

[project.urls]
Homepage = "https://github.com/linville/pydbisam/"
Changelog = "https://github.com/linville/pydbisam/blob/main/CHANGELOG.md"
Issues = "https://github.com/linville/pydbisam/issues"

[project.scripts]
pydbisam = "pydbisam.cli:main"

[tool.black]
line-length = 88

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]
select = [
  "A",   # built-ins
  "B",   # flake8-bugbear
  "E",   # pycodestyle
  "F",   # pyflakes
  "FBT", # flake8-boolean-trap
  "I",   # isort
  "PIE", # various unnecessary
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]
